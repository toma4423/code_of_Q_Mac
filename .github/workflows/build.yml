name: Build Application

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install
        pip install pyinstaller
    
    - name: Build with PyInstaller
      run: |
        # まずspec fileを生成
        pyi-makespec \
          --windowed \
          --name "コードのQちゃん" \
          --icon=code_of_Q.icns \
          --target-arch arm64 \
          --osx-bundle-identifier "com.toma.codeofq" \
          --hidden-import PyQt6 \
          --hidden-import PyQt6.QtCore \
          --hidden-import PyQt6.QtGui \
          --hidden-import PyQt6.QtWidgets \
          --hidden-import cv2 \
          --hidden-import PIL \
          --hidden-import PIL._tkinter_finder \
          --hidden-import PIL.Image \
          --hidden-import qrcode \
          --hidden-import qrcode.image \
          --hidden-import numpy \
          --hidden-import numpy.core \
          --collect-submodules PyQt6 \
          --collect-submodules cv2 \
          --collect-submodules PIL \
          --collect-submodules qrcode \
          --collect-data PyQt6 \
          --collect-data cv2 \
          --collect-data PIL \
          --collect-data qrcode \
          --add-data "Info.plist:." \
          --add-binary '/System/Library/Frameworks/Cocoa.framework/Cocoa:Frameworks' \
          --add-binary '/System/Library/Frameworks/CoreVideo.framework/CoreVideo:Frameworks' \
          code_of_Q.py

        # spec fileを編集
        echo "app = BUNDLE(exe," >> コードのQちゃん.spec
        echo "         name='コードのQちゃん.app'," >> コードのQちゃん.spec
        echo "         icon='code_of_Q.icns'," >> コードのQちゃん.spec
        echo "         bundle_identifier='com.toma.codeofq'," >> コードのQちゃん.spec
        echo "         info_plist={" >> コードのQちゃん.spec
        echo "             'CFBundleShortVersionString': '1.0.0'," >> コードのQちゃん.spec
        echo "             'CFBundleVersion': '1.0.0'," >> コードのQちゃん.spec
        echo "             'NSHighResolutionCapable': 'True'," >> コードのQちゃん.spec
        echo "             'NSCameraUsageDescription': 'QRコードの読み取りにカメラを使用します'," >> コードのQちゃん.spec
        echo "             'LSMinimumSystemVersion': '10.13.0'," >> コードのQちゃん.spec
        echo "             'NSRequiresAquaSystemAppearance': 'No'," >> コードのQちゃん.spec
        echo "             'NSMicrophoneUsageDescription': 'Not used'," >> コードのQちゃん.spec
        echo "         }," >> コードのQちゃん.spec
        echo "         collect_all=['PyQt6', 'cv2', 'PIL', 'qrcode', 'numpy']," >> コードのQちゃん.spec
        echo "         collect_binaries=['PyQt6', 'cv2']," >> コードのQちゃん.spec
        echo "         )" >> コードのQちゃん.spec

        # ビルドを実行
        pyinstaller --clean --noconfirm コードのQちゃん.spec

    - name: Fix App Bundle
      run: |
        cd dist
        # アプリケーションバンドルの権限を修正
        chmod -R +x "コードのQちゃん.app"
        xattr -cr "コードのQちゃん.app"
        # zipファイルを作成（-y オプションでシンボリックリンクを保持）
        zip -ry "コードのQちゃん.app.zip" "コードのQちゃん.app"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: コードのQちゃん.app
        path: dist/コードのQちゃん.app.zip

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/*
        body_path: CHANGELOG.md
        name: "すごいぞコードのQちゃん！ v${{ github.ref_name }}"
        body: |
          # すごいぞコードのQちゃん！ v${{ github.ref_name }}

          ## ダウンロード方法
          1. 下の「Assets」セクションから「コードのQちゃん.app」をダウンロード
          2. ダウンロードしたファイルをApplicationsフォルダに移動
          3. 初回起動時はControlキーを押しながらアプリをクリックして「開く」を選択

          ## 注意事項
          - macOS専用アプリケーションです
          - 初回起動時にカメラへのアクセス許可を求められます

          ## 更新内容
          ${{ github.event.release.body }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
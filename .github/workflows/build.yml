name: Build Application

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install
        pip install pyinstaller
    
    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name "コードのQちゃん" \
          --add-data="Info.plist:." \
          code_of_Q.py

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: コードのQちゃん.app
        path: dist/*

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/*
        body_path: CHANGELOG.md
        name: "すごいぞコードのQちゃん！ v${{ github.ref_name }}"
        body: |
          # すごいぞコードのQちゃん！ v${{ github.ref_name }}

          ## ダウンロード方法
          1. 下の「Assets」セクションから「コードのQちゃん.app」をダウンロード
          2. ダウンロードしたファイルをApplicationsフォルダに移動
          3. 初回起動時はControlキーを押しながらアプリをクリックして「開く」を選択

          ## 注意事項
          - macOS専用アプリケーションです
          - 初回起動時にカメラへのアクセス許可を求められます

          ## 更新内容
          ${{ github.event.release.body }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
[project]
name = "code-of-q"
version = "0.1.2"
description = "QRコード読み取り・生成アプリケーション"
authors = [
    {name = "toma"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "qrcode>=8.0.0",
    "PyQt6>=6.4.0",
]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
qr = "code_of_Q:main"

[tool.poetry]
name = "code-of-q"
version = "0.1.2"
description = "QRコード読み取り・生成アプリケーション"
authors = ["Your Name <your.email@example.com>"]
packages = [
    { include = "code_of_Q.py" }
]
include = [
    { path = "Info.plist" }
]

[tool.poetry.group.dev.dependencies]
pyinstaller = "^6.3.0"
